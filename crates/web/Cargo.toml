[package]
name = "meshwebllm-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
layer-split-experiment = []

[dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
iroh.workspace = true
bao-tree = { version = "0.17", default-features = false }
iroh-blobs = { version = "=0.104.1", default-features = false }
iroh-gossip.workspace = true
meshwebllm-core.workspace = true
n0-future.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
web-sys = { version = "0.3", features = ["console"] }
# Must equal the version of the wasm-bindgen CLI that builds the web app.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.5"
