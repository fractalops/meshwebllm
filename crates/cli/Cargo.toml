[package]
name = "meshwebllm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Run prompts on browser tabs that serve WebLLM over iroh"

[[bin]]
name = "meshwebllm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
iroh.workspace = true
meshwebllm-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
