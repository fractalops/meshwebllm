<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>libgrid · Browser model distribution</title>
  <style>
    :root {
      color-scheme: dark;
      background: #101414;
      color: #dde5e2;
      font-family: ui-monospace, monospace;
    }
    body {
      max-width: 1100px;
      margin: 48px auto;
      padding: 0 28px;
    }
    small {
      color: #8bad9e;
    }
    h1 {
      font: 500 34px system-ui;
    }
    p {
      line-height: 1.6;
      color: #afc1b7;
    }
    button,
    a.action {
      display: inline-block;
      background: #19372b;
      border: 1px solid #476e59;
      border-radius: 8px;
      color: #d8f9e3;
      font: inherit;
      padding: 12px 16px;
      margin: 5px;
      text-decoration: none;
    }
    button:disabled {
      opacity: 0.4;
    }
    pre {
      background: #171f1b;
      padding: 18px;
      border: 1px solid #2b4035;
      border-radius: 9px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.5;
    }
    #log {
      max-height: 320px;
      overflow: auto;
    }
    .good {
      color: #b5efc7;
    }
    .bad {
      color: #ffb1a9;
    }
    label {
      display: block;
      margin: 12px 0;
    }
    input {
      background: #19221d;
      color: #dde5e2;
      border: 1px solid #476e59;
      border-radius: 5px;
      padding: 8px;
    }
    #summary {
      font-size: 14px;
    }
    #results {
      max-height: 500px;
      overflow: auto;
    }
  </style>
  <small>LIBGRID / BROWSER EXPERIMENT</small>
  <h1 id="title">A model, shared between browser tabs.</h1>
  <p id="intro">
    One tab seeds the original model. Two peers download verified weight chunks
    over iroh-blobs, assemble their own stages, and run WebGPU inference.
  </p>
  <section id="seed-controls">
    <label
      >Relay URL (blank uses public relays)
      <input id="relay" placeholder="Public iroh relays" /></label
    ><button id="publish">Publish model from this browser</button>
    <div id="invites"></div>
    <button id="compare" disabled>Compare distributed inference</button
    ><button id="verify-cache" disabled>Verify cached weights offline</button>
  </section>
  <p id="status">Ready.</p>
  <pre id="summary">No results yet.</pre>
  <pre id="log"></pre>
  <details>
    <summary>Machine-readable evidence</summary>
    <pre id="results"></pre>
  </details>
  <script type="module" src="/blob-main.js"></script>
</html>
