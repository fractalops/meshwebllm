[advisories]
version = 2
ignore = [
  # Unmaintained build-time diagnostic macro, no patched version or vulnerability
  # reported. Pinned iroh-blobs / bao-tree require genawaiter 0.99.1.
  { id = "RUSTSEC-2024-0370", reason = "transitive via iroh-blobs/bao-tree genawaiter; build-time only" },
  # Unmaintained, no known vulnerability. Comes from postcard 1.x through
  # heapless 0.7. iroh and iroh-gossip use the same postcard version.
  { id = "RUSTSEC-2023-0089", reason = "transitive via postcard; no vulnerability" },
  # Unmaintained proc-macro, no known vulnerability. Comes from iroh through
  # netwatch and netlink-packet-core.
  { id = "RUSTSEC-2024-0436", reason = "transitive via iroh; build-time only" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # iroh's browser WebSocket transport (ws_stream_wasm, pharos, async_io_stream).
  "Unlicense",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
